name: Release
# Se dispara al subir una etiqueta vX.Y.Z: publica el paquete NuGet (si hay clave) y crea la release en GitHub.
# Packagist se actualiza solo: registre el repositorio dte-chile-php en packagist.org y active su webhook de GitHub.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Pruebas
        run: dotnet test dotnet/DteChile.sln --nologo
      - name: Empaquetar NuGet con la versión de la etiqueta
        run: dotnet pack dotnet/src/DteChile/DteChile.csproj -c Release -o nupkg -p:Version=${GITHUB_REF_NAME#v}
      - name: Publicar en NuGet (solo si existe el secreto NUGET_API_KEY)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          else
            echo "Sin NUGET_API_KEY: no se publica en NuGet."
          fi
      - name: Release en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nupkg/*.nupkg --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
