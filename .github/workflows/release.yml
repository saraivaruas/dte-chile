name: Release
# Se dispara al subir una etiqueta vX.Y.Z: publica el paquete en NuGet (Trusted Publishing) y en GitHub Packages, y crea la release en GitHub.
# También se puede lanzar a mano (workflow_dispatch) indicando la versión, para publicar de nuevo en los registros sin crear release.
# Packagist se actualiza solo: registre el repositorio dte-chile-php en packagist.org y active su webhook de GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a empaquetar y publicar (ej. 0.3.0)'
        required: true
permissions:
  contents: write
  packages: write   # GitHub Packages
  id-token: write   # Trusted Publishing de NuGet: GitHub se identifica solo, sin guardar claves
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Pruebas
        run: dotnet test dotnet/DteChile.sln --nologo
      - name: Empaquetar NuGet con la versión de la etiqueta
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: dotnet pack dotnet/src/DteChile/DteChile.csproj -c Release -o nupkg -p:Version="${VERSION#v}"
      - name: Acceso a NuGet (Trusted Publishing)
        id: nuget
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: jorgesaraivaruas
      - name: Publicar en NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          else
            echo "Sin acceso a NuGet (ni Trusted Publishing ni NUGET_API_KEY): no se publica en NuGet."
          fi
      - name: Publicar en GitHub Packages
        run: dotnet nuget push nupkg/*.nupkg --api-key "${{ github.token }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
      - name: Release en GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nupkg/*.nupkg --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
